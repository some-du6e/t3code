name: Red build

# T3 Code Red on GitHub-hosted runners: checks the fork's own changes, builds an
# unsigned Windows x64 installer and the linux-x64 CLI archive, and publishes
# both as the fork's latest release. release.yml needs Blacksmith runners and
# release secrets, so only its per-target packager, release-desktop.yml, is reused.

on:
  push:
    # red-* branches get the checks and builds but no release.
    branches: [red, "red-*"]
  workflow_dispatch:

concurrency:
  group: red-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version
    if: github.repository == 'some-du6e/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: /apps/desktop/package.json
          sparse-checkout-cone-mode: false

      # The desktop version with its patch bumped, as nightlies do, under an
      # identifier no official channel uses, so every channel pattern reads it
      # as the stable track.
      - id: version
        name: Resolve fork version
        run: |
          base="$(jq -r .version apps/desktop/package.json)"
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::apps/desktop/package.json has version '$base', not X.Y.Z."
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-red.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    if: github.repository == 'some-du6e/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # check:changed needs the history back to its merge base with upstream.
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --filter=blob:none upstream +refs/heads/main:refs/remotes/upstream/main

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # check:changed runs the tests beside changed files: desktop tests load
      # Electron, and web browser tests run in headless Chromium.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Check the fork's changes
        id: check_changed
        env:
          # 40 minutes per step on these 4-vCPU runners, not the default 15.
          CHECK_CHANGED_TIMEOUT: "2400"
        run: vp run check:changed upstream/main

      # A parallel typecheck task that fails prints nothing there; one at a time, each shows why.
      # Packages check:changed already passed replay from the cache.
      - name: Show typecheck failures
        if: ${{ failure() && steps.check_changed.outcome == 'failure' }}
        run: |
          for dir in apps/* packages/* infra/* scripts; do
            grep -qs '"typecheck"' "$dir/package.json" || continue
            echo "::group::typecheck $dir"
            status=0
            vp run --filter "./$dir" typecheck > "$RUNNER_TEMP/typecheck.txt" 2>&1 || status=$?
            grep -v -e "TS377141" -e "^\s*[0-9]* .*Schema.TaggedError" -e "^\s*~*\s*$" "$RUNNER_TEMP/typecheck.txt" | tail -80
            echo "exit $status"
            echo "::endgroup::"
          done

      - name: Check i18n catalogs
        run: vp run i18n:check

      # A rebase onto upstream can bring the official identity back, and a build
      # carrying it installs over, or shares state with, official T3 Code. It runs
      # last so a hit can't skip the checks, and still runs when a check fails.
      - name: Fork identity guard
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          command -v rg > /dev/null || { sudo apt-get update && sudo apt-get install -y ripgrep; }
          failed=0
          guard() {
            local pattern=$1 hits status=0
            shift
            hits="$(rg --with-filename --line-number --no-heading -g '!*.test.ts' -e "$pattern" -- "$@")" || status=$?
            [[ $status -eq 1 ]] && return
            failed=1
            if [[ $status -ne 0 ]]; then
              echo "::error::Could not search $* for $pattern (rg exit $status). Update this guard if upstream moved the code."
              return
            fi
            while IFS=: read -r file line text; do
              echo "::error file=$file,line=$line::Official T3 Code identity is back in $file:$line:$text"
            done <<< "$hits"
          }
          guard '"com\.t3tools\.t3code' apps/desktop/src scripts/build-desktop-artifact.ts
          guard 'homeDirectory, "\.t3"\),' apps/desktop/src/app/DesktopStatePaths.ts
          guard 'HostProcess\.HomeDirectory, "\.t3"\)' apps/server/src/os-jank.ts
          guard '\$HOME/\.t3[/"]' packages/ssh/src apps/desktop/src/wsl
          guard 'pingdotgg/t3code' packages/shared/src/cliRelease.ts
          guard '"t3code-v2"' apps/desktop/src/app/DesktopUserData.ts
          guard 'BOOT_SERVICE_NAME = "t3code"' apps/server/src/cloud/bootService.ts
          # @clerk/electron registers the OS-wide t3code: protocol handler only when given `renderer`.
          guard '^\s*renderer\b' apps/desktop/src/app/DesktopClerk.ts
          guard 'name: "t3code"' scripts/build-desktop-artifact.ts
          guard '"t3code", unitName|t3code-\$\{domain\}' apps/server/src/serviceLauncher.ts
          guard '= 3773;' apps/server/src/config.ts packages/ssh/src/tunnel.ts apps/desktop/src/app/DesktopApp.ts
          guard '"t3\.(cmd|exe)"|if not defined T3CODE_HOME|T3CODE_HOME:-' apps/desktop/src/app/DesktopCliShim.ts apps/desktop/src/app/DesktopCliCommand.ts apps/server/src/cli/install.ts
          guard '"com\.t3tools\.t3code|90-t3code-protect' apps/server/src/cloud
          guard '"\.t3"|\$HOME/\.t3/' apps/server/src/device apps/server/src/cli/browser.ts
          guard "'\.t3'" apps/server/src/device
          exit "$failed"

  build_bundle:
    name: Build JS bundle
    needs: [meta]
    if: github.repository == 'some-du6e/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to the fork version
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      # release-desktop.yml extracts this into apps/, as with release.yml's bundle.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # release-desktop.yml's Windows build waits for a job whose name ends in
  # "Build Linux x64" and embeds its cli-linux-x64 artifact as the WSL runtime.
  cli_linux:
    name: Build Linux x64
    needs: [meta, build_bundle]
    if: github.repository == 'some-du6e/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          # release-desktop.yml's install, so the Windows build restores this store.
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Align package versions to the fork version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      # The desktop packager gives its own copy of this client the same brand.
      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts red apps/server/dist/client

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      # The archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          # The archive is already gzip.
          compression-level: 0

  windows:
    name: Desktop Windows x64
    needs: [meta, build_bundle]
    if: github.repository == 'some-du6e/t3code'
    permissions:
      # The Windows build lists this run's jobs and artifacts to wait for cli-linux-x64.
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ github.sha }}
      # Only "preview" changes packaging: it drops the updater feed.
      release_channel: red
      relay_client_tracing: false
      # Empty, so the build bakes in no T3 Connect config.
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
      # cli_linux saves the pnpm store this job installs.
      save_pnpm_store: false

  release:
    name: Publish release
    needs: [meta, checks, cli_linux, windows]
    if: github.repository == 'some-du6e/t3code' && github.ref == 'refs/heads/red'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: release-assets

      - name: Download Linux CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: release-assets

      # release-desktop.yml suffixes the Windows feed for upstream's x64/arm64
      # merge, but installed apps read latest.yml. t3 update verifies the
      # archive against SHA256SUMS.
      - name: Prepare release assets
        working-directory: release-assets
        run: |
          rm -f builder-debug.yml
          mv latest-win-x64.yml latest.yml
          sha256sum t3-*.tar.gz > SHA256SUMS
          ls -l

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # A rerun finds this run's release. gh release create uploads into a
          # draft and publishes it last, so a cancelled attempt can leave a draft.
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)"; then
            gh release upload "$TAG" release-assets/* --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$TAG" --draft=false --latest
            fi
          else
            gh release create "$TAG" release-assets/* --latest --target "$GITHUB_SHA" \
              --title "T3 Code Red $VERSION" \
              --notes "Unofficial T3 Code Red build of ${GITHUB_SHA::12} from the red branch. Not a T3 Code release."
          fi
